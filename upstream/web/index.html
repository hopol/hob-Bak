<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f4" />
    <script>
      (() => {
        let theme = "system";
        try { theme = localStorage.getItem("hob.theme") || "system"; } catch {}
        const dark = theme === "dark" || (theme !== "light" && theme !== "dark" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        // 和 theme.ts 的 statusSurface 一致：手机用 --bg，宽屏用 --side
        const narrow = innerWidth < 768;
        document.querySelector('meta[name="theme-color"]').content = narrow ? (dark ? "#151516" : "#ffffff") : dark ? "#1b1b1d" : "#f6f6f4";
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <link rel="icon" href="/icons/favicon-32.png?v=3" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hob" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hob</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
