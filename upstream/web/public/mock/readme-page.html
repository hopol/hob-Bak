<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队资料整理方案</title>
<style>
body{margin:0;background:#faf9f5;color:#282d2a;font:16px/1.75 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:56px 42px}small{color:#638577;letter-spacing:.12em}h1{font-size:36px;line-height:1.3;margin:12px 0}h2{font-size:21px;margin:36px 0 12px}p{color:#59645e}.lead{font-size:18px}.recommend{background:#e7f0e7;border-radius:16px;padding:20px 24px}.recommend strong{color:#315a45}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #e2e9df;border-radius:14px;padding:17px}.card b{display:block;color:#365a48}.card span{font-size:14px;color:#69766e}@media(max-width:560px){main{padding:32px 24px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head>
<body><main><small>团队协作 · 方案比较</small><h1>让团队资料<br>有一个共同的入口</h1><p class="lead">比较共享文档、知识库和文件夹，选择适合当前团队的整理方式。</p><div class="recommend"><strong>建议先从共享文档开始</strong><p>保留现有文件，用一页目录连接常用资料；等内容增长后再迁入知识库。</p></div><h2>三种方案</h2><div class="grid"><div class="card"><b>共享文档</b><span>上手快，适合作为统一入口。</span></div><div class="card"><b>知识库</b><span>便于搜索和维护长期资料。</span></div><div class="card"><b>共享文件夹</b><span>适合集中存放原始文件。</span></div></div><h2>下一步</h2><p>列出常用资料、确认负责人，再建立目录并定期检查链接。</p></main></body></html>
