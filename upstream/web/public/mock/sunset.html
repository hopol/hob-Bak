<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>如果在地球和火星同时看日落</title>
<style>
  :root { --bg: #faf9f6; --fg: #1d1d1f; --mute: #6e6e73; --card: #fff; --line: #e8e6e1; }
  :root.dark { --bg: #161616; --fg: #f2f2f2; --mute: #9a9a9f; --card: #1f1f1f; --line: #2c2c2c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 22px 48px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -.01em; }
  .lead { color: var(--mute); margin: 0 0 26px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 14px 14px; }
  figcaption b { display: block; font-size: 15px; }
  figcaption span { color: var(--mute); font-size: 13px; }
  h2 { font-size: 17px; margin: 30px 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--mute); font-weight: 500; }
  .why { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .why div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .why b { display: block; margin-bottom: 4px; }
  .why p { margin: 0; color: var(--mute); font-size: 13.5px; }
  @media (max-width: 560px) { .pair, .why { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>如果在地球和火星同时看日落</h1>
  <p class="lead">同一个视角：太阳刚落到地平线。看太阳周围，再看远离太阳的天空。</p>

  <div class="pair">
    <figure>
      <svg viewBox="0 0 400 260">
        <defs>
          <linearGradient id="es" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3b5d9a"/><stop offset=".45" stop-color="#c9718a"/><stop offset=".78" stop-color="#f29a4a"/><stop offset="1" stop-color="#ffcf73"/>
          </linearGradient>
          <radialGradient id="eg" cx=".5" cy="1" r=".55"><stop offset="0" stop-color="#fff2b8"/><stop offset=".35" stop-color="#ffb35c" stop-opacity=".8"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="400" height="260" fill="url(#es)"/>
        <ellipse cx="200" cy="205" rx="230" ry="120" fill="url(#eg)"/>
        <circle cx="200" cy="203" r="17" fill="#fff6d6"/>
        <path d="M0 205 L60 192 L120 200 L190 186 L260 198 L330 188 L400 200 L400 260 L0 260Z" fill="#2b2233"/>
      </svg>
      <figcaption><b>地球</b><span>太阳周围橙红，头顶仍是蓝色</span></figcaption>
    </figure>
    <figure>
      <svg viewBox="0 0 400 260">
        <defs>
          <linearGradient id="ms" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5a4334"/><stop offset=".5" stop-color="#a0785a"/><stop offset="1" stop-color="#c79c74"/>
          </linearGradient>
          <radialGradient id="mg" cx=".5" cy="1" r=".42"><stop offset="0" stop-color="#e6f2ff"/><stop offset=".3" stop-color="#8fb6e8" stop-opacity=".9"/><stop offset="1" stop-color="#5f86c4" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="400" height="260" fill="url(#ms)"/>
        <ellipse cx="200" cy="208" rx="170" ry="110" fill="url(#mg)"/>
        <circle cx="200" cy="206" r="11" fill="#f4f8ff"/>
        <path d="M0 208 L70 198 L140 204 L210 194 L280 203 L350 196 L400 202 L400 260 L0 260Z" fill="#4a2c22"/>
      </svg>
      <figcaption><b>火星</b><span>太阳周围泛蓝，远处是黄褐色</span></figcaption>
    </figure>
  </div>

  <h2>为什么正好相反</h2>
  <div class="why">
    <div><b>地球：气体分子</b><p>空气分子更容易把蓝光散射到四面八方。日落时光路变长，蓝光在路上散尽，只剩橙红照过来。</p></div>
    <div><b>火星：尘埃颗粒</b><p>尘埃颗粒约 1.5 µm，把蓝光集中朝前方散射，所以蓝色只聚在太阳附近，其余天空被尘埃染成黄褐。</p></div>
  </div>

  <h2>对比</h2>
  <table>
    <tr><th>项目</th><th>地球</th><th>火星</th></tr>
    <tr><td>大气压</td><td>1013 hPa</td><td>约 6 hPa</td></tr>
    <tr><td>主要散射体</td><td>气体分子</td><td>尘埃颗粒</td></tr>
    <tr><td>白天天空</td><td>蓝色</td><td>黄褐色</td></tr>
    <tr><td>日落颜色</td><td>红橙</td><td>蓝色</td></tr>
  </table>
</main>
<script>
  const apply = () => document.documentElement.classList.toggle("dark", location.hash === "#dark");
  apply(); addEventListener("hashchange", apply);
</script>
</body>
</html>
