<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff; --side:#f6f6f4; --sel:#eaeae6; --panel:#fafaf8; --line:#ececea;
  --text:#18181a; --text2:#6d6d72; --text3:#a4a4a9;
  --bubble:#f1f1ef; --card:#ffffff; --field:#efefec;
  --user:#18181a; --utext:#ffffff;
  --accent:#ff6a2b; --ok:#22a065;
  --stage:#ecebe7;
}
.dark{
  --bg:#151516; --side:#1b1b1d; --sel:#2a2a2d; --panel:#18181a; --line:#262629;
  --text:#ececed; --text2:#a1a1a7; --text3:#6b6b71;
  --bubble:#232326; --card:#2c2c30; --field:#232326;
  --user:#f1f1ef; --utext:#151516;
  --stage:#0e0e0f;
}
html,body{background:var(--stage)}
body{font-family:Inter,"Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px}
.i{display:block;flex:none}
.mono{font-family:"JetBrains Mono","Noto Sans Mono CJK SC",monospace}

/* app shell */
.app{display:flex;width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--text)}
.side{width:296px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px 12px}
.side-top{display:flex;gap:6px;align-items:center}
.search{flex:1;height:34px;border-radius:10px;background:var(--field);display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--text3);font-size:14px}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text2)}
.pins{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0 4px}
.pin{position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 4px 10px;border-radius:14px}
.pin.sel{background:var(--sel)}
.pin .nm{margin-top:8px;font-size:13px;font-weight:500}
.pin .sub{margin-top:1px;font-size:11.5px;color:var(--text3)}
.badge{position:absolute;top:11px;left:calc(50% + 15px);width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--side)}
.pin.sel .badge{border-color:var(--sel)}
.gt{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);padding:14px 8px 6px}
.row{display:flex;gap:11px;align-items:center;padding:9px 8px;border-radius:12px}
.row.sel{background:var(--sel)}
.row .main{flex:1;min-width:0}
.row .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .nm{font-size:14px;font-weight:500}
.row .tm{font-size:12px;color:var(--text3);flex:none}
.row .pv{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .new{font-size:11px;color:var(--accent);font-weight:500;margin-left:6px}
.fold{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;font-size:13px;color:var(--text3)}
.side-foot{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:2px}
.frow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;font-size:14px;color:var(--text2)}
.frow .sp{flex:1}

/* avatars */
.av{border-radius:50%;display:grid;place-items:center;flex:none}
.av svg{width:62%;height:62%;image-rendering:pixelated}
.tile{display:grid;place-items:center;border-radius:7px;background:var(--user);color:var(--utext);font-weight:600;flex:none}

/* chat */
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.head{height:54px;flex:none;display:flex;align-items:center;gap:9px;padding:0 18px 0 22px;border-bottom:1px solid var(--line)}
.head .nm{font-size:15px;font-weight:500}
.head .sp{flex:1}
.msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:6px}
.col{width:100%;max-width:724px;margin:0 auto;padding:0 34px;display:flex;flex-direction:column}
.div{align-self:center;font-size:12px;color:var(--text3);margin:18px 0 10px}
.sys{align-self:center;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text3);margin:10px 0}
.b,.u{font-size:15px;line-height:1.62;border-radius:18px;padding:9px 14px;margin-top:4px}
.b{align-self:flex-start;max-width:548px;background:var(--bubble)}
.u{align-self:flex-end;max-width:500px;background:var(--user);color:var(--utext)}
.g{height:12px}
.b ul{list-style:none}
.b li{display:flex;gap:8px;align-items:flex-start}
.b li .i{margin-top:5px;color:var(--text2)}
.b .muted{color:var(--text2)}
.qt{font-weight:500}
.qs{font-size:13.5px;color:var(--text2);margin-top:1px}
.opts{margin:10px 0 4px;background:var(--card);border-radius:12px;overflow:hidden}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14.5px;line-height:1.4;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.key{width:20px;height:20px;border-radius:6px;background:var(--bubble);color:var(--text3);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.opt.chosen{color:var(--text2)}
.opt .ck{margin-left:auto;color:var(--text2)}
.tt{display:flex;align-items:center;gap:10px;font-weight:500}
.st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--text2);white-space:nowrap}
.st .i{color:var(--accent)}
.meta{font-size:13px;color:var(--text2);margin-top:3px}
.acts{display:flex;gap:8px;margin:10px 0 3px}
.btn{height:32px;padding:0 13px;border-radius:999px;background:var(--card);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn.solid{background:var(--user);color:var(--utext)}
.btn.ghost{background:transparent;color:var(--text2);padding:0 6px}
.att{display:flex;align-items:center;gap:11px;background:var(--bubble);border-radius:12px;padding:10px 12px;margin:8px 0 3px}
.att .ico{width:34px;height:40px;border-radius:7px;background:var(--card);display:grid;place-items:center;color:var(--text2)}
.att .n{font-size:14px;font-weight:500}
.att .m{font-size:12.5px;color:var(--text2)}
.quote{border-left:2px solid currentColor;opacity:.62;padding-left:9px;font-size:13px;line-height:1.5;margin:2px 0 5px}
.tag{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);margin:2px 0 0 4px}
.hov{position:relative}
.tools{position:absolute;right:-104px;top:50%;transform:translateY(-50%);display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;color:var(--text2)}
.tools span{width:28px;height:26px;display:grid;place-items:center;border-radius:7px}
.link{color:var(--text);text-decoration:underline;text-decoration-color:var(--text3);text-underline-offset:3px}
.compwrap{flex:none;padding:8px 0 20px}
.comp{display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;background:var(--field);padding:0 8px}
.comp .pl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.comp .ph{flex:1;color:var(--text3);font-size:15px}
.comp .mic{width:36px;height:36px;border-radius:50%;background:var(--user);color:var(--utext);display:grid;place-items:center}

/* draft card */
.draft{background:var(--card);border-radius:14px;padding:16px 16px 14px;margin:10px 0 4px;width:470px}
.draft .top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.draft .dn{font-size:16px;font-weight:600}
.draft .ds{font-size:12.5px;color:var(--text3);margin-top:1px}
.kv{display:flex;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.kv .k{width:62px;flex:none;color:var(--text3);font-size:13px;padding-top:1px}

/* right panel */
.panel{width:344px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:0 20px 20px;overflow:hidden}
.phead{height:54px;flex:none;display:flex;align-items:center;gap:4px;margin:0 -8px 6px;color:var(--text2)}
.phead .t{flex:1;text-align:center;font-size:14.5px;font-weight:500;color:var(--text)}
.screen{background:#141416;border-radius:12px;height:186px;padding:13px 14px;font-size:12px;line-height:1.75;color:#c7c7cc;overflow:hidden;font-family:"JetBrains Mono","Noto Sans Mono CJK SC",monospace}
.dark .screen{background:#0d0d0e;box-shadow:inset 0 0 0 1px #262629}
.screen div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.screen .p{color:#ff8a4c}.screen .d{color:#76767c}.screen .cur{display:inline-block;width:7px;height:14px;background:#ff8a4c;vertical-align:-2px}
.cap{text-align:center;font-size:12px;color:var(--text3);margin:9px 0 22px}
.sech{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px}
.rt{display:flex;gap:11px;padding:9px 0}
.rt .i{color:var(--ok);margin-top:2px}
.rt.paused .i{color:var(--text3)}
.rt .n{font-size:14px}.rt .s{font-size:12.5px;color:var(--text2);margin-top:1px}
.lbl{font-size:12.5px;color:var(--text2);margin:16px 0 6px}
.field{background:var(--field);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.6}
.ctl{display:flex;align-items:center;gap:10px;margin-top:2px}
.tog{width:38px;height:22px;border-radius:999px;background:var(--text);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.ctl .sp{flex:1}
.pbtn{height:30px;padding:0 12px;border-radius:9px;background:var(--field);font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.pbtn.solid{background:var(--user);color:var(--utext)}
.when{background:var(--field);border-radius:10px;padding:2px 12px}
.when .w{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.when .w+.w{border-top:1px solid var(--line);color:var(--text2);font-size:13px}
.run{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px;border-top:1px solid var(--line)}
.run:first-of-type{border-top:0}
.run .i{color:var(--ok)}
.rule{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .v{font-size:13px;color:var(--text2);display:flex;gap:6px;align-items:center}
.rule .hot{color:var(--accent);font-size:11.5px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--field);border-radius:8px;padding:5px 9px;font-size:13px}
.note{font-size:12px;color:var(--text3);margin-top:8px}
.bigav{display:flex;justify-content:center;margin:4px 0 2px}

/* phones */
.stage{width:1440px;height:900px;background:var(--stage);display:flex;align-items:center;justify-content:center;gap:110px}
.phone{width:372px;height:792px;border-radius:58px;background:#0b0b0c;padding:11px;box-shadow:0 0 0 1.5px #3a3a3c}
.scr{position:relative;width:100%;height:100%;border-radius:47px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0b0b0c}
.sbar{height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600}
.sbar .r{display:flex;gap:6px;align-items:center}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 18px 4px}
.mhead .sp{flex:1}
.me{width:32px;height:32px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--text2)}
.mpins{display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px 6px}
.mpins .pin{padding:10px 2px 8px}
.mlist{padding:0 8px}
.mlist .row{padding:10px 10px}
.mchat-head{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.mchat-head .nm{font-size:16px;font-weight:500}
.mchat-head .sp{flex:1}
.mmsgs{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px 6px}
.mmsgs .b,.mmsgs .u{font-size:14.5px;max-width:300px}
.mmsgs .b.q{max-width:312px}
.mmsgs .opt{font-size:14px;padding:10px 11px}
.mcomp{display:flex;align-items:center;gap:8px;height:46px;border-radius:23px;background:var(--field);margin:6px 12px 30px;padding:0 6px}
.mcomp .ph{flex:1;color:var(--text3);font-size:14.5px}
.mcomp .mic{width:34px;height:34px;border-radius:50%;background:var(--user);color:var(--utext);display:grid;place-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--text)}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- pixel sprites (12x12) ----------
const SP = {
  hob:{bg:'#ffe6d3',pal:{k:'#40261a',o:'#ff7a2e',y:'#ffcf4a',e:'#40261a'},rows:[
    '......k.....','.....kok....','.....kook...','..k.koook...','.kokoooook..','.kooooooook.',
    'kooyyyyyyook','koyyeyyeyyok','koyyeyyeyyok','koyyyyyyyyok','.kooyyyyook.','..kkkkkkkk..']},
  page:{bg:'#e9e5ff',pal:{k:'#2f2b3a',p:'#ffffff',l:'#cdc6e2',e:'#2f2b3a',c:'#ffb3c1'},rows:[
    '............','..kkkkkkk...','..kpppppkk..','..kpppppkkk.','..kpppppppk.','..kpepppepk.',
    '..kpepppepk.','..kcpppppck.','..kplllllpk.','..kpppppppk.','..kplllpppk.','..kkkkkkkkk.']},
  server:{bg:'#d9f2e6',pal:{k:'#23282e',m:'#e2e7ec',d:'#b8c3cd',g:'#2fd07f',e:'#23282e'},rows:[
    '............','.kkkkkkkkkk.','.kmmmmmmmmk.','.kmemmmmemk.','.kmemmmmemk.','.kmmmmmmmmk.',
    '.kkkkkkkkkk.','.kddddddgdk.','.kkkkkkkkkk.','.kddddddgdk.','.kkkkkkkkkk.','............']},
  bird:{bg:'#fff0c4',pal:{k:'#1d2a3a',b:'#4ea3ff',l:'#d6ebff',y:'#ffb020',e:'#1d2a3a'},rows:[
    '............','....kkkk....','...kbbbbk...','..kbbbbebk..','..kbbbbbbkyy','.kbbbbbbbk..',
    'kbblllbbbk..','kbllllbbk...','.kllllbk....','..kkkkk.....','...k.k......','............']},
  house:{bg:'#ffdfe0',pal:{k:'#2d2622',r:'#ff8b6a',w:'#fff7ea',d:'#9b6b52',e:'#2d2622'},rows:[
    '.....kk.....','....krrk....','...krrrrk...','..krrrrrrk..','.krrrrrrrrk.','kkkkkkkkkkkk',
    '.kwwwwwwwwk.','.kwewwwwewk.','.kwewwwwewk.','.kwwwddwwwk.','.kwwwddwwwk.','.kkkkkkkkkk.']},
  coin:{bg:'#e3eeff',pal:{k:'#3b2f08',c:'#ffd23f',d:'#d49a00',e:'#3b2f08'},rows:[
    '....kkkk....','..kkcccckk..','.kcccccccck.','kcccccccccck','kcccecceccck','kcccecceccck',
    'kcccccccccck','kccdccccdcck','kcccddddccck','.kcccccccck.','..kkcccckk..','....kkkk....']},
};
function px(n){const s=SP[n];let r='';s.rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${s.pal[ch]}"/>`}));
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges">${r}</svg>`}
const av=(n,s)=>`<div class="av" style="width:${s}px;height:${s}px;background:${SP[n].bg}">${px(n)}</div>`;
const tile=(s)=>`<div class="tile" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.6)}px">⏱</div>`;

// ---------- icons ----------
const I={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  gear:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  dbl:'<path d="m6 17 5-5-5-5M13 17l5-5-5-5"/>',
  left:'<path d="m15 18-6-6 6-6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
  pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  check:'<path d="M5 12.5 10 17l9-10"/>',
  spin:'<path d="M12 3a9 9 0 1 0 9 9" />',
  out:'<path d="M7 17 17 7M8.5 7H17v8.5"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  reply:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/>',
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 1.8 3.5 1.8 3.5-1.8 3.5-1.8M9 9.5h.01M15 9.5h.01"/>',
  more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  panel:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/>',
  mem:'<path d="M12 3.5 14 9l5.5 2-5.5 2-2 5.5-2-5.5L4.5 11 10 9z"/>',
  rule:'<path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
};
const ic=(n,s=16,w=1.7)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

// ---------- sidebar ----------
const PINS=[{a:'hob',nm:'Hob',sub:'主助手'},{a:'page',nm:'写作',sub:'周报和文章'},{a:'server',nm:'服务器',sub:'线上和机器'}];
function sidebar({sel='hob',badge='page',withBird=true,birdNew=false}={}){
  const rows=[
    withBird&&{a:'bird',nm:'行业动态',tm:'09:00',pv:'今天 6 条，挑了 2 条重点',isNew:birdNew},
    {a:'house',nm:'家里 NAS',tm:'07:30',pv:'相册备份完成，新增 312 张'},
    {a:'coin',nm:'记账',tm:'昨天',pv:'10 月账单整理好了，比上月少 12%'},
  ].filter(Boolean);
  return `<aside class="side">
    <div class="side-top"><div class="search">${ic('search',15)}搜索</div><div class="ib">${ic('edit',17)}</div></div>
    <div class="pins">${PINS.map(p=>`<div class="pin ${p.a===sel?'sel':''}">${av(p.a,52)}${p.a===badge?'<span class="badge"></span>':''}<div class="nm">${p.nm}</div><div class="sub">${p.sub}</div></div>`).join('')}</div>
    <div class="gt"><span>日常</span></div>
    ${rows.map(r=>`<div class="row ${r.a===sel?'sel':''}">${av(r.a,42)}<div class="main"><div class="l1"><span class="nm">${r.nm}${r.isNew?'<span class="new">新</span>':''}</span><span class="tm">${r.tm}</span></div><div class="pv">${r.pv}</div></div></div>`).join('')}
    <div class="fold"><span>收起的助手</span><span>2</span></div>
    <div class="side-foot">
      <div class="frow">${tile(22)}<span class="sp">工作台</span>${ic('out',15)}</div>
      <div class="frow">${ic('gear',18)}<span class="sp">设置</span></div>
    </div></aside>`;
}

// ---------- chat pieces ----------
const div=t=>`<div class="div">${t}</div>`;
const sys=(t,i)=>`<div class="sys">${i?ic(i,14):''}${t}</div>`;
const b=(h,c='')=>`<div class="b ${c}">${h}</div>`;

function q(title,sub,opts,chosen){
  const list=chosen!=null
    ?`<div class="opt chosen"><span class="key">${opts[chosen][0]}</span>${opts[chosen][1]}<span class="ck">${ic('check',16)}</span></div>`
    :opts.map(o=>`<div class="opt"><span class="key">${o[0]}</span>${o[1]}</div>`).join('');
  return b(`<div class="qt">${title}</div>${sub?`<div class="qs">${sub}</div>`:''}<div class="opts">${list}</div>`,'q');
}
